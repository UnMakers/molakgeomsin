# 몰락검신 iOS — 맥 없이 아이폰용 .ipa 만들기
# 윈도우 유니티가 뽑은 Xcode 프로젝트(zip, 조각 xcode.zip.000, .001 …)를 'ios-버전' 태그 릴리스에 올리면,
# 깃허브의 macOS 서버가 서명 없이 빌드해 같은 릴리스에 molakgeomsin-unsigned.ipa 를 붙인다.
# 그 .ipa 는 윈도우의 Sideloadly 등으로 무료 애플 ID 서명을 해 아이폰에 설치한다(7일마다 재서명). tools/ios/README.md 참고.
name: iOS unsigned IPA
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "릴리스 태그 (예: ios-0.4.41)"
        required: true
permissions:
  contents: write
jobs:
  ipa:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'ios-')
    runs-on: macos-15
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Xcode 프로젝트 내려받기
        run: |
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p 'xcode.zip.*' -D parts
          ls -la parts
          cat $(ls parts/xcode.zip.* | sort) > xcode.zip
          unzip -q xcode.zip -d proj
          ls proj
      - name: 서명 없이 빌드
        run: |
          cd proj
          xcodebuild -version
          xcodebuild -project Unity-iPhone.xcodeproj -scheme Unity-iPhone -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/molak.xcarchive" \
            archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" \
            > "$RUNNER_TEMP/xcodebuild.log" 2>&1 || { tail -200 "$RUNNER_TEMP/xcodebuild.log"; exit 1; }
          tail -30 "$RUNNER_TEMP/xcodebuild.log"
      - name: .ipa 로 묶기
        run: |
          mkdir -p Payload
          cp -R "$RUNNER_TEMP"/molak.xcarchive/Products/Applications/*.app Payload/
          zip -qry molakgeomsin-unsigned.ipa Payload
          ls -la molakgeomsin-unsigned.ipa
      - name: 릴리스에 올리기
        run: gh release upload "$TAG" molakgeomsin-unsigned.ipa --clobber -R "$GITHUB_REPOSITORY"
      - name: 실패하면 빌드 기록 올리기
        if: failure()
        run: gh release upload "$TAG" "$RUNNER_TEMP/xcodebuild.log" --clobber -R "$GITHUB_REPOSITORY" || true
